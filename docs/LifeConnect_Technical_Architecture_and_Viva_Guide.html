## 4. Where and How Data Is Stored

Data in LifeConnect is stored across **three distinct tiers**: Relational Disk Storage (SQLite), In-Memory Caching (Python process), and Browser Client Storage (\`localStorage\`).

\`\`\`
┌────────────────────────────────────────────────────────────────────────┐
│                        DATA PERSISTENCE TIERS                          │
└────────────────────────────────────────────────────────────────────────┘

 [1] Relational Tier (SQLite 3)
     Location: c:\\LifeConnect\\backend\\lifeconnect.db
     Mode: PRAGMA journal_mode=WAL (Write-Ahead Logging for high concurrency)
     Tables: users, memories, connections, communities,
             community_members, wellness_activities, user_content_interactions

 [2] In-Memory Application Cache
     Location: Python RAM process
     Structures:
       - _voice_search_cache (LRU dict, max 200 items for instant voice search)
       - _news_cache (Cached RSS dictionary with 15-minute TTL)

 [3] Client-Side Browser Storage
     Location: Browser localStorage (per origin)
     Keys:
       - lc_user: Active authenticated session profile
       - lc_content_interactions: Map of watched/ignored video IDs
       - lc_theme: Light / Dark mode preference
       - lc_font_size: Accessibility text-scale preference

## 5. Security Architecture

\`\`\`
User Input (Password)
         │
         ▼
[PBKDF2 HMAC-SHA256] ◄── Cryptographic Salt (16-byte random hex)
         │
         ├── 100,000 Iterations
         ▼
Derived Key (32 bytes hex)
         │
         ▼
Stored in DB as: pbkdf2:100000:<salt>:<derived_key>
\`\`\`

1. **Password Protection**: Passwords are never stored in plaintext. They are hashed using **PBKDF2 with SHA-256**, a 16-byte unique cryptographic salt per user, and 100,000 iterations.
2. **Timing-Attack Resistance**: Verification uses \`hmac.compare_digest\` to prevent timing attacks.
3. **SQL Injection Immunity**: 100% of database queries use parameterized SQL (\`?\` placeholders). No string interpolation is used anywhere in SQL statements.
4. **CORS Hardening**: FastAPI \`CORSMiddleware\` explicitly whitelists trusted origins with configurable production domains.
5. **No Hallucinated URLs**: Curated content relies on validated oEmbed IDs and authentic CDN assets.

## 6. Comprehensive Viva & Interview Q&A Guide

### A. Architecture & Technology Decisions

#### Q1: Why did you choose FastAPI instead of Django or Flask?
> **Answer**: FastAPI is built on ASGI (Asynchronous Server Gateway Interface) via Starlette and Uvicorn. It handles concurrent I/O operations (such as parallel news fetching and streaming recommendation calls) asynchronously without blocking worker threads. Furthermore, FastAPI provides automatic request validation via Pydantic v2 and generates interactive OpenAPI documentation (\`/api/docs\`) with zero boilerplate. Django would introduce unnecessary ORM overhead, and Flask lacks native async and built-in schema validation.

#### Q2: Why did you use Vanilla JavaScript instead of React, Next.js, or Vue?
> **Answer**: Senior citizens often browse on budget smartphones with limited RAM and slower mobile networks. A React or Next.js app carries 200KB–500KB of JavaScript runtime bundles before rendering the first pixel. Vanilla ES6+ has zero bundle overhead, starts instantly, executes natively, and allows direct DOM manipulation without virtual DOM diffing latency.

#### Q3: Why SQLite? Isn't PostgreSQL better for production?
> **Answer**: For LifeConnect's architecture, SQLite offers zero-configuration self-contained deployment, zero network latency between app and DB, and ACID compliance. With \`PRAGMA journal_mode=WAL\` (Write-Ahead Logging), SQLite supports concurrent readers while a writer writes. For containerized deployments on Render or Railway, it operates within single-instance persistent storage. The code is abstracted through Python's DB-API 2.0, meaning swapping to PostgreSQL simply involves swapping the connection string to \`asyncpg\` or \`psycopg2\`.

---

### B. Algorithmic & Recommendation Logic

#### Q4: How does the recommendation algorithm personalize videos for each user?
> **Answer**: The algorithm in \`backend/routes.py\` applies a weighted multi-factor scoring formula:
> 1. **Base Score (10 pts)**: Every video in the catalog begins with 10 points.
> 2. **Decade Era Match (+35 pts)**: If the video's era matches the user's birth/youth decade (e.g. 1970s).
> 3. **Wellness Goal Match (+45 pts)**: If the user's health goal (e.g. "chair yoga", "joint relief", "morning walk") matches the video's content tags.
> 4. **Cultural Preference Match (+30 pts per tag)**: Matches with user's selected artists (Lata, Kishore, Rafi, Jagjit Singh) or regional preferences.
> 5. **Negative Filtering**: Any video recorded in \`user_content_interactions\` with action \`watched\` or \`ignored\` is strictly excluded from future queries.

#### Q5: How do you support infinite scrolling without running out of videos?
> **Answer**: The system uses a two-tier recommendation engine:
> * **Tier 1 (Curated Catalog)**: 50+ hand-verified public videos across YouTube, Facebook Watch, 𝕏, and Archive.org.
> * **Tier 2 (Procedural Infinite Stream)**: When a senior scrolls past Tier 1, \`generate_infinite_content_batch\` procedurally constructs fresh, personalized recommendations based on topic blueprints, authentic search deep links, and thematic high-resolution imagery. The feed never runs out.

#### Q6: How are Facebook Watch and 𝕏 videos integrated alongside YouTube?
> **Answer**: Each video object carries a \`platform\` attribute (\`youtube\`, \`facebook\`, \`x\`, \`archive\`). 
> * YouTube videos offer both an in-app distraction-free modal player (\`youtube-nocookie.com/embed\`) and an external launch option.
> * Facebook Watch and 𝕏 cards render dedicated platform badges, launch deep links to authentic video reels, and trigger automatic interaction tracking to update the recommendation stream.

---

### C. Voice Assistant & AI

#### Q7: How does the Voice Assistant work?
> **Answer**: The Voice Assistant uses a hybrid pipeline:
> 1. **Input (Speech-to-Text)**: Uses the browser's native \`webkitSpeechRecognition\` with multi-lingual support (\`hi-IN\` Hindi and \`en-IN\` Indian English).
> 2. **Processing**: Queries are sent to \`/api/voice-search\`. The engine checks an in-memory LRU cache (\`_voice_search_cache\`). If missing, it computes a direct factual response using the LLM model with a specialized prompt designed for clear, brief spoken answers.
> 3. **Output (Text-to-Speech)**: The answer is synthesized using the browser's \`speechSynthesis\` API with natural pitch and pacing tailored for seniors, accompanied by a server-side audio synthesis endpoint.

#### Q8: What is the difference between the AI Companion and the Voice Assistant?
> **Answer**: 
> * **Voice Assistant** (\`/api/voice-search\`): Modeled after Google Assistant. It answers factual, real-world queries (e.g., market vegetable prices, weather, historical dates, health remedies) in 1–2 direct sentences.
> * **AI Companion** (\`/api/chat\`): Modeled as an empathetic friend with three user-selectable personas: **Mitra** (cheerful supportive friend), **Guru** (wise philosophical elder), and **Saheli** (warm nostalgic confidante). It maintains conversational context and provides emotional companionship.

---

### D. News Engine & Real-Time Aggregation

#### Q9: How does the 24-hour News Bulletin aggregate news without external API keys?
> **Answer**: \`backend/news_service.py\` connects to live public RSS feeds from Prasar Bharati (DD News), Press Information Bureau (PIB), The Hindu, and Times of India. It extracts headlines, publication timestamps, summaries, and categorizes articles across 12 Indian cities. Results are cached in memory with a 15-minute TTL (Time-To-Live) to avoid hammering remote news servers.

---

### E. Senior Accessibility (A11y) & UX

#### Q10: What design considerations make LifeConnect senior-friendly?
> **Answer**:
> 1. **Typography**: High legibility serif headings (\`Playfair Display\`) and clean sans-serif body text (\`Plus Jakarta Sans\`), starting at 18px body size with a dedicated font-scaling slider (100% to 150%).
> 2. **Touch Targets**: All clickable buttons and cards have a minimum touch bounding box of 48×48px to accommodate tremors or diminished fine motor control.
> 3. **Color Contrast**: Complies with WCAG 2.1 AA standards (contrast ratio >= 4.5:1), using warm earthy tones (\`#2D5A27\` Forest Green, \`#D96B27\` Deep Terracotta) that reduce eye fatigue compared to harsh blue light.
> 4. **Tactile Feedback**: Interactive buttons utilize subtle scale transformations and audible click sounds (optional) to confirm action execution.
> 5. **Zero Technical Jargon**: Prompts avoid technical terms like "Authenticate", "Payload", or "Buffer", replacing them with "Welcome", "Save Memory", and "Play".

---

### F. DevOps, Deployment & Diagnostics

#### Q11: Why did Render fail during initial deployment, and how was it solved?
> **Answer**: Two distinct issues occurred:
> 1. **Root Directory Execution**: Render executed uvicorn from the project root where \`main.py\` was absent and \`backend/\` was not in \`sys.path\`. We created a root [main.py](file:///c:/LifeConnect/main.py) entry point with dynamic \`sys.path\` injection.
> 2. **Python 3.11 Module-Level NameError**: In \`backend/models.py\`, \`_voice_search_cache: Dict[str, str] = {}\` was evaluated at module import time. In Python 3.11, missing \`from typing import Dict\` throws a fatal \`NameError\`. We resolved this by adding \`from __future__ import annotations\` and explicit typing imports.

#### Q12: How does LifeConnect run across both Docker containers and Serverless platforms (like Vercel)?
> **Answer**:
> * **Docker / Render**: The standard \`uvicorn main:app --host 0.0.0.0 --port \$PORT\` command runs a long-lived ASGI process with persistent SQLite file storage.
> * **Vercel Serverless**: In \`api/index.py\`, we wrap the FastAPI instance with **Mangum** (\`handler = Mangum(app)\`), which translates AWS Lambda/Vercel serverless HTTP events into standard ASGI calls. The database switches to \`/tmp/lifeconnect.db\` with \`PRAGMA journal_mode=MEMORY\` to prevent read-only filesystem locks.
